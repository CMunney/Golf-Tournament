<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Tournament Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a6b3c;
    --green-light: #e8f5ee;
    --green-mid: #2d9b5a;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --bg: #f8f9fa;
    --card: #ffffff;
    --gray-light: #f3f4f6;
    --leprev: #1a4fa0;
    --leprev-light: #e8eef8;
    --pm: #7c2d8e;
    --pm-light: #f5edf8;
    --amber: #c47d0e;
    --amber-light: #fef3dc;
    --blue: #1a4fa0;
    --blue-light: #e8eef8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--green); color: white; padding: 1.25rem 1rem 1rem; text-align: center; }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

  .sync-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 1rem; background: white; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
  .dot.ok { background: #16a34a; }
  .dot.err { background: #dc2626; }
  .dot.syncing { background: #d97706; }
  .refresh-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); padding: 2px 6px; border-radius: 6px; }

  .main { padding: 1rem; max-width: 520px; margin: 0 auto; }

  .team-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
  .team-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .team-card.leading { border: 2px solid var(--green-mid); }
  .team-card .team-name { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .team-leprev { color: var(--leprev); }
  .team-pm { color: var(--pm); }

  .stat-row { display: flex; flex-direction: column; gap: 7px; }
  .stat-item { display: flex; justify-content: space-between; align-items: center; }
  .stat-label { font-size: 11px; color: var(--text-muted); }
  .stat-value { font-size: 15px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .stat-value.matches { color: var(--green); }
  .stat-value.bonus { color: var(--amber); }

  .divider { height: 0.5px; background: var(--border); margin: 6px 0; }

  .winner-banner { text-align: center; padding: 10px; background: var(--green-light); border-radius: 10px; margin-bottom: 1.25rem; font-size: 13px; font-weight: 600; color: var(--green); }

  .round-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 1.25rem 0 8px; }

  .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mc-title { font-size: 14px; font-weight: 600; }
  .badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 99px; letter-spacing: 0.03em; }
  .badge-pending { background: var(--gray-light); color: var(--text-muted); }
  .badge-live { background: #dcfce7; color: #15803d; }
  .badge-final { background: var(--green-light); color: var(--green); }

  .hole-standing {
    text-align: center; font-size: 16px; font-weight: 600;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 10px;
  }
  .hs-leprev { background: var(--leprev-light); color: var(--leprev); }
  .hs-pm { background: var(--pm-light); color: var(--pm); }
  .hs-square { background: var(--gray-light); color: var(--text-muted); font-weight: 500; font-size: 14px; }
  .hs-final-leprev { background: var(--leprev-light); color: var(--leprev); }
  .hs-final-pm { background: var(--pm-light); color: var(--pm); }
  .hs-final-tie { background: var(--amber-light); color: var(--amber); }

  .hole-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 10px; }
  .hdot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); }
  .hdot.leprev { background: var(--leprev); }
  .hdot.pm { background: var(--pm); }
  .hdot.half { background: var(--green-mid); }

  .hole-btns { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; margin-bottom: 10px; }
  .hbtn { padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--gray-light); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
  .hbtn:active { transform: scale(0.97); }
  .hbtn.active-leprev { background: var(--leprev-light); border-color: var(--leprev); color: var(--leprev); font-weight: 600; }
  .hbtn.active-pm { background: var(--pm-light); border-color: var(--pm); color: var(--pm); font-weight: 600; }
  .hbtn.active-half { background: #dcfce7; border-color: var(--green-mid); color: var(--green); font-weight: 600; }

  .bonus-section { border-top: 1px solid var(--border); padding-top: 10px; }
  .bonus-title { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 7px; }
  .bonus-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bonus-col-name { font-size: 11px; font-weight: 600; margin-bottom: 5px; }
  .bonus-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .bchip { font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--gray-light); color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .bchip:active { transform: scale(0.95); }
  .bchip.on-birdie { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
  .bchip.on-eagle { background: var(--amber-light); border-color: var(--amber); color: var(--amber); }

  .finalize-row { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .fin-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--gray-light); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
  .fin-btn.ready { background: var(--green-light); border-color: var(--green-mid); color: var(--green); font-weight: 600; }
  .fin-btn:active { transform: scale(0.98); }

  .footer { text-align: center; padding: 2rem 1rem 3rem; font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <h1>⛳ Golf Tournament</h1>
  <p>Team Leprev vs Team PM &middot; 2v2 Scramble &middot; Match Play</p>
</header>

<div class="sync-bar">
  <div style="display:flex;align-items:center;gap:6px">
    <span class="dot" id="sync-dot"></span>
    <span id="sync-label">Connecting...</span>
  </div>
  <button class="refresh-btn" onclick="loadData()" aria-label="Refresh">↻</button>
</div>

<div class="main">
  <div class="team-totals" id="totals"></div>
  <div id="matches-container"></div>
  <div class="footer">Auto-refreshes every 30s &middot; tap ↻ to refresh now</div>
</div>

<script>
const GS_URL = 'https://script.google.com/macros/s/AKfycbyfDNA-EdTrVmXgQsy1rjNtepe3_m8h7j7e0Y9E60DEeWneevDvKqG6ZIpAfXpFMJA/exec';
const PTS = { win: 10, tie: 5, birdie: 3, eagle: 5 };

let state = {
  matches: Array.from({ length: 6 }, (_, i) => ({
    id: i, round: Math.floor(i / 3) + 1, inRound: (i % 3) + 1,
    holes: Array(18).fill(null),
    birdies: { A: 0, B: 0 }, eagles: { A: 0, B: 0 }, finalized: false
  }))
};

function setSyncStatus(s) {
  document.getElementById('sync-dot').className = 'dot ' + s;
  document.getElementById('sync-label').textContent = s === 'ok' ? 'Live' : s === 'err' ? 'Sync error — tap ↻' : 'Syncing...';
}

async function loadData() {
  setSyncStatus('syncing');
  try {
    const r = await fetch(GS_URL + '?t=' + Date.now());
    const raw = await r.json();
    if (raw && raw.length > 1) parseSheet(raw);
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('err'); }
  render();
}

function parseSheet(rows) {
  rows.slice(1).forEach(row => {
    const id = parseInt(row[0]);
    if (isNaN(id) || id < 0 || id > 5) return;
    const m = state.matches[id];
    for (let h = 0; h < 18; h++) {
      const v = row[2 + h];
      m.holes[h] = (v === '' || v === null || v === undefined) ? null : String(v);
    }
    m.birdies.A = parseInt(row[20]) || 0;
    m.birdies.B = parseInt(row[21]) || 0;
    m.eagles.A = parseInt(row[22]) || 0;
    m.eagles.B = parseInt(row[23]) || 0;
    m.finalized = row[24] === '1' || row[24] === 1 || row[24] === 'true' || row[24] === true;
  });
}

async function saveMatch(m) {
  setSyncStatus('syncing');
  const holesData = m.holes.map(h => h === null ? '' : h);
  const rowData = [m.id, '', ...holesData, m.birdies.A, m.birdies.B, m.eagles.A, m.eagles.B, m.finalized ? '1' : '0'];
  try {
    await fetch(GS_URL, { method: 'POST', body: JSON.stringify({ row: m.id + 2, data: rowData }) });
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('err'); }
}

function holesPlayed(m) { return m.holes.filter(h => h !== null).length; }

function holeBalance(m) {
  return m.holes.reduce((up, h) => h === 'A' ? up + 1 : h === 'B' ? up - 1 : up, 0);
}

function matchStatus(m) {
  const played = holesPlayed(m);
  const up = holeBalance(m);
  const remaining = 18 - played;
  if (m.finalized || played === 18 || Math.abs(up) > remaining) {
    if (up > 0) return { type: 'final', winner: 'A' };
    if (up < 0) return { type: 'final', winner: 'B' };
    return { type: 'final', winner: 'tie' };
  }
  if (played === 0) return { type: 'pending', winner: null };
  return { type: 'live', winner: null };
}

function bonusPts(m, team) {
  return m.birdies[team] * PTS.birdie + m.eagles[team] * PTS.eagle;
}

function matchPts(m, team) {
  const st = matchStatus(m);
  if (st.type !== 'final') return 0;
  if (st.winner === 'tie') return PTS.tie;
  if (st.winner === 'A' && team === 'A') return PTS.win;
  if (st.winner === 'B' && team === 'B') return PTS.win;
  return 0;
}

function teamStats() {
  let matchesLeading = { A: 0, B: 0 };
  let bonusTotal = { A: 0, B: 0 };
  let lockedPts = { A: 0, B: 0 };

  state.matches.forEach(m => {
    const st = matchStatus(m);
    const up = holeBalance(m);
    const played = holesPlayed(m);

    if (st.type === 'live' && played > 0) {
      if (up > 0) matchesLeading.A++;
      else if (up < 0) matchesLeading.B++;
    }
    if (st.type === 'final') {
      if (st.winner === 'A') matchesLeading.A++;
      else if (st.winner === 'B') matchesLeading.B++;
      lockedPts.A += matchPts(m, 'A');
      lockedPts.B += matchPts(m, 'B');
    }

    bonusTotal.A += bonusPts(m, 'A');
    bonusTotal.B += bonusPts(m, 'B');
  });

  return { matchesLeading, bonusTotal, lockedPts };
}

function setHole(matchId, holeIdx, val) {
  const m = state.matches[matchId];
  if (m.finalized) return;
  m.holes[holeIdx] = m.holes[holeIdx] === val ? null : val;
  saveMatch(m); render();
}

function toggleBonus(matchId, team, type) {
  const m = state.matches[matchId];
  const cur = m[type + 's'][team];
  m[type + 's'][team] = cur >= 5 ? 0 : cur + 1;
  saveMatch(m); render();
}

function finalizeMatch(matchId) {
  const m = state.matches[matchId];
  if (!m.finalized && !confirm('Finalize this match and lock in the points?')) return;
  m.finalized = !m.finalized;
  saveMatch(m); render();
}

function render() {
  const stats = teamStats();
  const aAhead = stats.matchesLeading.A > stats.matchesLeading.B || (stats.matchesLeading.A === stats.matchesLeading.B && stats.bonusTotal.A > stats.bonusTotal.B);
  const bAhead = stats.matchesLeading.B > stats.matchesLeading.A || (stats.matchesLeading.B === stats.matchesLeading.A && stats.bonusTotal.B > stats.bonusTotal.A);

  document.getElementById('totals').innerHTML = `
    <div class="team-card ${aAhead ? 'leading' : ''}">
      <div class="team-name team-leprev">Team Leprev</div>
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-label">Matches leading</span>
          <span class="stat-value matches">${stats.matchesLeading.A}</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <span class="stat-label">Bonus pts (birds/eagles)</span>
          <span class="stat-value bonus">${stats.bonusTotal.A}</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <span class="stat-label">Locked match pts</span>
          <span class="stat-value">${stats.lockedPts.A}</span>
        </div>
      </div>
    </div>
    <div class="team-card ${bAhead ? 'leading' : ''}">
      <div class="team-name team-pm">Team PM</div>
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-label">Matches leading</span>
          <span class="stat-value matches">${stats.matchesLeading.B}</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <span class="stat-label">Bonus pts (birds/eagles)</span>
          <span class="stat-value bonus">${stats.bonusTotal.B}</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <span class="stat-label">Locked match pts</span>
          <span class="stat-value">${stats.lockedPts.B}</span>
        </div>
      </div>
    </div>`;

  let html = '';
  for (let r = 1; r <= 2; r++) {
    html += `<div class="round-label">Round ${r}</div>`;
    state.matches.filter(m => m.round === r).forEach(m => {
      const played = holesPlayed(m);
      const st = matchStatus(m);
      const up = holeBalance(m);
      const remaining = 18 - played;
      const nextHole = Math.min(played, 17);

      const badgeCls = m.finalized ? 'badge-final' : st.type === 'live' ? 'badge-live' : 'badge-pending';
      const badgeText = m.finalized ? 'Final' : st.type === 'live' ? 'Live' : 'Pending';

      let standingText, standingCls;
      if (st.type === 'final') {
        if (st.winner === 'A') { standingText = 'Leprev wins'; standingCls = 'hs-final-leprev'; }
        else if (st.winner === 'B') { standingText = 'PM wins'; standingCls = 'hs-final-pm'; }
        else { standingText = 'Tied — halved match'; standingCls = 'hs-final-tie'; }
      } else if (st.type === 'live') {
        if (up === 0) { standingText = 'All square · thru ' + played; standingCls = 'hs-square'; }
        else if (up > 0) { standingText = 'Leprev up ' + up + ' · thru ' + played; standingCls = 'hs-leprev'; }
        else { standingText = 'PM up ' + Math.abs(up) + ' · thru ' + played; standingCls = 'hs-pm'; }
      } else {
        standingText = 'Not started'; standingCls = 'hs-square';
      }

      html += `<div class="match-card">
        <div class="mc-header">
          <span class="mc-title">Match ${m.inRound}</span>
          <span class="badge ${badgeCls}">${badgeText}</span>
        </div>
        <div class="hole-standing ${standingCls}">${standingText}</div>`;

      if (!m.finalized) {
        if (played > 0) {
          html += `<div class="hole-dots">`;
          for (let h = 0; h < 18; h++) {
            const v = m.holes[h];
            const cls = v === 'A' ? 'leprev' : v === 'B' ? 'pm' : v === 'half' ? 'half' : '';
            html += `<div class="hdot ${cls}" title="Hole ${h+1}${v ? ': '+(v==='A'?'Leprev':v==='B'?'PM':'Halved') : ''}"></div>`;
          }
          html += `</div>`;
        }
        html += `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:500">Hole ${nextHole + 1} result</div>
          <div class="hole-btns">
            <button class="hbtn ${m.holes[nextHole]==='A'?'active-leprev':''}" onclick="setHole(${m.id},${nextHole},'A')">Leprev</button>
            <button class="hbtn ${m.holes[nextHole]==='half'?'active-half':''}" onclick="setHole(${m.id},${nextHole},'half')" style="font-size:12px;padding:10px 4px">Halved</button>
            <button class="hbtn ${m.holes[nextHole]==='B'?'active-pm':''}" onclick="setHole(${m.id},${nextHole},'B')">PM</button>
          </div>`;
      }

      html += `<div class="bonus-section">
        <div class="bonus-title">Bonus points this match</div>
        <div class="bonus-cols">
          <div>
            <div class="bonus-col-name team-leprev">Leprev</div>
            <div class="bonus-chips">
              <span class="bchip ${m.birdies.A>0?'on-birdie':''}" onclick="toggleBonus(${m.id},'A','birdie')">Birdie${m.birdies.A>0?' ×'+m.birdies.A:''}</span>
              <span class="bchip ${m.eagles.A>0?'on-eagle':''}" onclick="toggleBonus(${m.id},'A','eagle')">Eagle${m.eagles.A>0?' ×'+m.eagles.A:''}</span>
            </div>
          </div>
          <div>
            <div class="bonus-col-name team-pm">PM</div>
            <div class="bonus-chips">
              <span class="bchip ${m.birdies.B>0?'on-birdie':''}" onclick="toggleBonus(${m.id},'B','birdie')">Birdie${m.birdies.B>0?' ×'+m.birdies.B:''}</span>
              <span class="bchip ${m.eagles.B>0?'on-eagle':''}" onclick="toggleBonus(${m.id},'B','eagle')">Eagle${m.eagles.B>0?' ×'+m.eagles.B:''}</span>
            </div>
          </div>
        </div>
      </div>`;

      if (played === 18 || st.type === 'final' || m.finalized) {
        html += `<div class="finalize-row">
          <button class="fin-btn ${!m.finalized?'ready':''}" onclick="finalizeMatch(${m.id})">
            ${m.finalized ? 'Unfinalize match' : 'Finalize &amp; lock in points'}
          </button>
        </div>`;
      }

      html += `</div>`;
    });
  }
  document.getElementById('matches-container').innerHTML = html;
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
